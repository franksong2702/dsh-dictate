name: Pinned DSH source compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: source-only (${{ matrix.node }}) — not npm installability
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.15.0]
    defaults:
      run:
        shell: bash
    env:
      DSH_TELEMETRY_MODE: DISABLED
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Check source workflow boundaries
        run: node scripts/check-source-workflow.mjs
      - name: Prepare source-only evidence
        run: mkdir -p "$RUNNER_TEMP/dictate-source-evidence"
      - name: Check out the immutable upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dd6322d604e00eec1ba5e0c8541159906a21094a
          path: .source-upstream
          persist-credentials: false
      - name: Check out the locked toolchain baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: franksong2702/dsh-dictate
          ref: 6b86d280d796b6c87f0dbb3ba5688c36c0bcf557
          path: .source-toolchain
          persist-credentials: false
      - name: Install tools from the unchanged baseline lockfile
        working-directory: .source-toolchain
        run: npx --yes pnpm@9.15.9 install --frozen-lockfile --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/dictate-source-evidence/toolchain-install.log"
      - name: Install the pinned upstream dependency graph
        working-directory: .source-upstream
        run: npx --yes pnpm@11.7.0 install --frozen-lockfile --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/dictate-source-evidence/upstream-install.log"
      - name: Build the pinned upstream source
        working-directory: .source-upstream
        run: npx --yes pnpm@11.7.0 run build 2>&1 | tee "$RUNNER_TEMP/dictate-source-evidence/upstream-build.log"
      - name: Verify Dictate against source, never the baseline DSH packages
        # npm exec exposes this pinned pnpm on PATH for the nested package check.
        run: npx --yes --package=pnpm@9.15.9 -- node scripts/check-dsh-source.mjs --source .source-upstream --tools .source-toolchain/node_modules --report-dir "$RUNNER_TEMP/dictate-source-evidence" 2>&1 | tee "$RUNNER_TEMP/dictate-source-evidence/checker.log"
      - name: Upload source-only logs and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-source-only-node-${{ matrix.node }}
          path: ${{ runner.temp }}/dictate-source-evidence
          if-no-files-found: warn
          retention-days: 14
