name: Native local ASR runtime

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "src/local-service-installer.ts"
      - "scripts/verify-package.mjs"
      - ".github/workflows/native-runtime.yml"
  pull_request:
    paths:
      - "native/**"
      - "src/local-service-installer.ts"
      - "scripts/verify-package.mjs"
      - ".github/workflows/native-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path native/local-asr/Cargo.toml
      - name: Build pinned native runtime source
        run: cargo build --release --locked --manifest-path native/local-asr/Cargo.toml
      - name: Verify bundled Apple Silicon runtime
        run: |
          file native/darwin-arm64/dsh-dictate-asr | grep -q 'Mach-O 64-bit executable arm64'
          test -x native/darwin-arm64/dsh-dictate-asr
          codesign --verify --strict native/darwin-arm64/dsh-dictate-asr

  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      TRANSCRIBE_CMAKE_ARGS: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test the native runtime on Windows x64
        run: cargo test --release --locked --manifest-path native/local-asr/Cargo.toml
      - name: Build the unsigned Windows x64 runtime
        run: cargo build --release --locked --manifest-path native/local-asr/Cargo.toml
      - name: Verify that the Windows runtime launches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $runtime = 'native/local-asr/target/release/dsh-dictate-asr.exe'
          $bytes = [System.IO.File]::ReadAllBytes($runtime)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            throw 'Windows runtime is not a PE executable.'
          }
          $ErrorActionPreference = 'Continue'
          & $runtime --model-path 'Z:\dsh-dictate-missing-model.gguf' 2>&1 |
            Tee-Object -FilePath native/local-asr/windows-launch.log
          $runtimeExitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($runtimeExitCode -eq 0) {
            throw 'Runtime unexpectedly accepted a missing model.'
          }
          if (-not (Select-String -Quiet -Path native/local-asr/windows-launch.log -Pattern 'DSH Dictate Local ASR')) {
            throw 'Runtime did not reach the Windows console entrypoint.'
          }
      - name: Stage the unsigned runtime artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item native/local-asr/target/release/dsh-dictate-asr.exe artifacts/dsh-dictate-asr.exe
          Get-FileHash artifacts/dsh-dictate-asr.exe -Algorithm SHA256
      - name: Upload the unsigned Windows x64 runtime
        uses: actions/upload-artifact@v4
        with:
          name: dsh-dictate-asr-win32-x64
          path: artifacts/dsh-dictate-asr.exe
          if-no-files-found: error
