[package]
name = "dsh-dictate-asr"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors"] }
transcribe-cpp = { version = "=0.2.1", default-features = false }

[profile.release]
lto = "thin"
strip = "debuginfo"
